<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velmora API — Swagger UI</title>
  <link rel="icon" type="image/png" href="/api/docs/assets/favicon-32x32.png" sizes="32x32">
  <link rel="stylesheet" href="/api/docs/assets/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #f5f6f8; }
    .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/api/docs/assets/swagger-ui-bundle.js"></script>
  <script src="/api/docs/assets/swagger-ui-standalone-preset.js"></script>
  <script>
    window.addEventListener("load", function () {
      window.ui = SwaggerUIBundle({
        url: "/api/docs/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        persistAuthorization: false,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        requestInterceptor: async function (request) {
          request.credentials = "include";
          const method = (request.method || "GET").toUpperCase();

          if (!["GET", "HEAD", "OPTIONS"].includes(method)) {
            const csrfResponse = await fetch("/sanctum/csrf-cookie", {
              credentials: "include",
            });
            if (!csrfResponse.ok) {
              throw new Error("Não foi possível inicializar a proteção CSRF.");
            }

            const cookie = document.cookie
              .split("; ")
              .find(function (part) { return part.startsWith("XSRF-TOKEN="); });
            if (!cookie) {
              throw new Error("O cookie XSRF-TOKEN não foi definido.");
            }

            request.headers = request.headers || {};
            request.headers["X-XSRF-TOKEN"] = decodeURIComponent(cookie.slice("XSRF-TOKEN=".length));
          }

          return request;
        },
      });
    });
  </script>
</body>
</html>
